name: Android

on: [push, pull_request]

jobs:
  Android:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Accept Android SDK licenses
      run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
    - name: Configure local properties
      run: |
        cd projects/android-project
        {
          echo "sdk.dir=$ANDROID_SDK_ROOT"
        } > local.properties
    - name: Set up compiler cache
      uses: ./.github/actions/setup-compiler-cache
      with:
        key: linux-android-arm64-sdl2
    - name: Build
      env:
        NDK_CCACHE: ccache
      run: |
        cd projects/android-project
        bash ../../projects/scripts/ci/time.sh Build ./gradlew assembleEcodeRelease -Pandroid.injected.ndk.abiFilters=arm64-v8a

    - name: Report build metrics
      if: always()
      uses: ./.github/actions/report-build-metrics

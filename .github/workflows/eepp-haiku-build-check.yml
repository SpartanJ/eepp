name: Haiku

on: [push, pull_request, workflow_dispatch]

permissions:
  actions: write
  contents: write

jobs:
  Haiku:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 2
        submodules: recursive
    - name: Set SDK version
      id: sdk_version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/eepp-* ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          echo "version=nightly" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up compiler cache
      uses: ./.github/actions/setup-compiler-cache
      with:
        key: haiku-r1beta6-x86_64-sdl3-sdk
        max-size: 1G
        vm: 'true'
    - name: Build all targets and package SDK
      timeout-minutes: 90
      uses: vmactions/haiku-vm@v1
      env:
        SDK_VERSION: ${{ steps.sdk_version.outputs.version }}
      with:
        release: r1beta6
        arch: x86_64
        mem: 8192
        # Concurrent build-directory creation stalls on the SSHFS-mounted workspace.
        # Compile and package on BFS, then copy results back to the runner.
        sync: scp
        envs: SDK_VERSION CCACHE_DIR CCACHE_BASEDIR CCACHE_COMPILERCHECK CCACHE_MAXSIZE CCACHE_COMPRESS CCACHE_COMPRESSLEVEL CCACHE_NOHARDLINK CCACHE_NOFILECLONE
        prepare: |
          set -eu
          pkgman install -y libsdl3 libsdl3_devel git gcc premake5 ccache
        run: |
          set -eu
          mkdir -p build-logs
          bash -e -o pipefail <<'BUILD'
          source projects/scripts/ci/setup-ccache.sh
          mkdir -p .ci-metrics
          trap 'ccache --show-stats > .ci-metrics/ccache.txt; ccache --print-stats > .ci-metrics/ccache-stats.tsv' EXIT
          {
            uname -a
            premake5 --disable-static-build --with-debug-symbols --with-backend=SDL3 gmake
            bash projects/scripts/ci/time.sh Build make -C make/haiku -j"$(nproc)" config=release_x86_64 all
            bash projects/scripts/ci/time.sh "Package SDK" bash projects/scripts/package_sdk.sh haiku x86_64 --strip --version "$SDK_VERSION"

            # Exercise the archive outside the checkout, including its runtime libraries.
            sdk_check=$(mktemp -d)
            tar -xzf projects/haiku/sdk/eepp-sdk-haiku-x86_64-*.tar.gz -C "$sdk_check"
            for manifest in src/tools/*/assets.list; do
              app=$(basename "$(dirname "$manifest")")
              test -x "$sdk_check/eepp-sdk/bin/$app"
            done
            test -f "$sdk_check/eepp-sdk/bin/libSDL3.so.0"
            test -f "$sdk_check/eepp-sdk/libs/haiku/x86_64/libeepp.so"
            (cd "$sdk_check" && EEPP_WINDOW_HIDDEN=1 ./eepp-sdk/bin/ecode --version)
            rm -rf "$sdk_check"
          } 2>&1 | tee build-logs/haiku.log
          BUILD
    - name: Upload SDK package
      uses: actions/upload-artifact@v4
      with:
        name: haiku-eepp-sdk-x86_64
        path: projects/haiku/sdk/eepp-sdk-*.tar.gz
        if-no-files-found: error
    - name: Publish SDK package
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/eepp-'))
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.sdk_version.outputs.version }}
        draft: false
        prerelease: ${{ steps.sdk_version.outputs.version == 'nightly' }}
        generate_release_notes: false
        fail_on_unmatched_files: true
        files: projects/haiku/sdk/eepp-sdk-haiku-x86_64-*.tar.gz
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: haiku-build-logs
        path: build-logs/haiku.log

    - name: Save compiler cache
      continue-on-error: true
      uses: ./.github/actions/save-compiler-cache
    - name: Report build metrics
      if: always()
      uses: ./.github/actions/report-build-metrics
      with:
        vm: 'true'
